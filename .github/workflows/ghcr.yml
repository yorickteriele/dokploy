name: GHCR Docker Build

# Builds this fork's image to ghcr.io/<owner>/dokploy. Tags `latest` and `v<version>`,
# which is what the in-app updater looks for when DOKPLOY_IMAGE points at ghcr.io.
on:
  push:
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: [self-hosted, pr-server]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^\t*"version": "\(.*\)",$/\1/p' apps/dokploy/package.json | head -n1)" >> "$GITHUB_OUTPUT"

  docker-amd:
    needs: [meta]
    runs-on: [self-hosted, pr-server]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: DOKPLOY_IMAGE=${{ needs.meta.outputs.image }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true

  # Stays GitHub-hosted: the self-hosted runner is amd64 and building arm64 under QEMU is far too slow.
  docker-arm:
    needs: [meta]
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: DOKPLOY_IMAGE=${{ needs.meta.outputs.image }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true

  combine-manifests:
    needs: [meta, docker-amd, docker-arm]
    runs-on: [self-hosted, pr-server]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
          AMD_DIGEST: ${{ needs.docker-amd.outputs.digest }}
          ARM_DIGEST: ${{ needs.docker-arm.outputs.digest }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" -t "${IMAGE}:${VERSION}" \
            "${IMAGE}@${AMD_DIGEST}" \
            "${IMAGE}@${ARM_DIGEST}"
